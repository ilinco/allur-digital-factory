services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allur-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    command: uvicorn allur_factory.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: allur-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: pnpm dev --host 0.0.0.0
    restart: unless-stopped
    depends_on:
      - backend
