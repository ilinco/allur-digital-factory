services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allur-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn allur_factory.main:app --host 0.0.0.0 --port 8000
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: allur-frontend-prod
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
